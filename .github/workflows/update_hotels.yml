name: Auto Update Japan Hotels Data (Batch Supported)

on:
  schedule:
    - cron: '0 20 1 * *'
  workflow_dispatch:
    inputs:
      region:
        description: '選擇要抓取的區域（已將九州拆分為南北兩區以防逾時）'
        required: true
        default: 'kansai'
        type: choice
        options:
          - kansai
          - tokyo
          - tokai
          - kyushu_north
          - kyushu_south
          - hokkaido
          - chugoku
          - tohoku
          - all

permissions:
  contents: write

jobs:
  update-hotel-json:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run hotel data generator for selected region
        run: |
          TARGET_REGION="${{ github.event.inputs.region || 'all' }}"
          echo "🚀 開始抓取目標區域: $TARGET_REGION"
          python generate_hotels_data.py "$TARGET_REGION"

      - name: Verify and Commit updated JSON files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ ! -s "./data/hotels_all.json" ] || [ $(wc -c < "./data/hotels_all.json") -lt 100 ]; then
            echo "⚠️ 警告：hotels_all.json 異常過小，中止寫入！"
            exit 1
          fi

          git add ./data/*.json
          
          if git diff --staged --quiet; then
            echo "✅ 圖資無變動，無需更新 Commit。"
          else
            git commit -m "chore(data): 更新飯店圖資 [${{ github.event.inputs.region || 'all' }}] ($(date +'%Y-%m-%d'))"
            git push
            echo "🎉 已成功推送最新圖資！"
          fi
