<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本連鎖商務飯店地圖篩選器</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 48vh; min-height: 300px; z-index: 1; }
    .chip-active { background-color: #0f172a; color: #ffffff; border-color: #0f172a; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">

  <!-- 頂部導覽與圖資狀態列 -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-base font-bold tracking-wide">🇯🇵 日本連鎖商務飯店篩選器</h1>
        <p id="data-status" class="text-xs text-emerald-400 mt-0.5">⏳ 正在載入雲端最新圖資...</p>
      </div>
      <div class="flex gap-1.5 text-xs">
        <button onclick="switchDataset('all')" id="btn-ds-all" class="ds-btn px-2.5 py-1.5 rounded bg-emerald-600 text-white font-medium">全國總覽</button>
        <button onclick="switchDataset('kansai')" id="btn-ds-kansai" class="ds-btn px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">關西圈</button>
        <button onclick="switchDataset('tokyo')" id="btn-ds-tokyo" class="ds-btn px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">首都圈</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 pt-3 space-y-3">
    <!-- 篩選條件面板 -->
    <section class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 space-y-3">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- 離車站距離滑桿 -->
        <div>
          <div class="flex justify-between text-xs font-semibold text-slate-700 mb-1">
            <span>🚉 距離最近車站上限</span>
            <span id="station-dist-label" class="text-blue-600">500 公尺內</span>
          </div>
          <input type="range" id="station-dist" min="100" max="2000" step="100" value="500" oninput="applyFilters()" class="w-full accent-slate-900">
        </div>

        <!-- 關鍵字搜尋（飯店名/站名） -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">🔍 搜尋飯店名稱或車站（如：難波、新宿、博多）</label>
          <input type="text" id="keyword-input" placeholder="輸入日文或中文關鍵字..." oninput="applyFilters()" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900">
        </div>
      </div>

      <!-- 機場直達路線篩選 -->
      <div>
        <div class="text-xs font-semibold text-slate-700 mb-1.5">✈️ 機場直達鐵道站點過濾（可複選）</div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="airport-filters">
          <button type="button" data-line="JR_HARUKA" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">關空 JR HARUKA</button>
          <button type="button" data-line="NANKAI" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">關空 南海電鐵</button>
          <button type="button" data-line="JR_NEX" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">成田 JR N'EX</button>
          <button type="button" data-line="KEISEI" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">成田 京成電鐵</button>
          <button type="button" data-line="KEIKYU" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">羽田 京急線</button>
          <button type="button" data-line="MONORAIL" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">羽田 東京單軌</button>
        </div>
      </div>

      <!-- 周邊生活機能（300m 內必備） -->
      <div>
        <div class="text-xs font-semibold text-slate-700 mb-1.5">🏪 步行 300 公尺內必備機能（可複選）</div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="amenity-filters">
          <button type="button" data-am="lawson" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">Lawson</button>
          <button type="button" data-am="seven" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">7-Eleven</button>
          <button type="button" data-am="familymart" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">FamilyMart</button>
          <button type="button" data-am="drugstore" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">藥妝店</button>
          <button type="button" data-am="supermarket" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">超市</button>
          <button type="button" data-am="mcdonalds" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50">麥當勞</button>
        </div>
      </div>

      <!-- 連鎖品牌過濾 -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-slate-700">🏨 連鎖商務飯店品牌（未選則顯示全部 15 品牌）</span>
          <button type="button" onclick="resetAllFilters()" class="text-xs text-rose-600 font-medium underline">清除所有條件</button>
        </div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="brand-filters"></div>
      </div>
    </section>

    <!-- 互動地圖 -->
    <section class="bg-white rounded-xl overflow-hidden shadow-sm border border-slate-200">
      <div id="map"></div>
    </section>

    <!-- 篩選結果列表 -->
    <section class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-800">符合條件飯店 (<span id="result-count">0</span> 間)</h2>
        <span class="text-xs text-slate-500">依距離車站由近到遠排序（最多顯示前 80 筆）</span>
      </div>
      <div id="hotel-list" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
    </section>
  </main>

  <script>
    const BRANDS = [
      "Toyoko Inn", "Dormy Inn", "APA Hotel", "Super Hotel", "Via Inn",
      "Route Inn", "Comfort Hotel", "Daiwa Roynet", "Richmond Hotel",
      "Fresa Inn", "Mitsui Garden", "Tokyu Stay", "Washington Hotel",
      "LiveMax", "Hotel Metropolitan"
    ];

    const LINE_NAMES = {
      "JR_HARUKA": "JR HARUKA", "NANKAI": "南海電鐵",
      "JR_NEX": "JR N'EX", "KEISEI": "京成電鐵",
      "KEIKYU": "京急線", "MONORAIL": "東京單軌"
    };

    let allHotels = [];
    let currentDataset = 'all';
    let map, markersLayer;

    // 初始化品牌按鈕
    const brandContainer = document.getElementById('brand-filters');
    BRANDS.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.brand = b;
      btn.textContent = b;
      btn.className = 'filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50';
      btn.onclick = () => toggleChip(btn);
      brandContainer.appendChild(btn);
    });

    // 初始化地圖
    map = L.map('map').setView([35.6812, 139.7671], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap & CARTO',
      maxZoom: 19
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    function toggleChip(el) {
      el.classList.toggle('chip-active');
      applyFilters();
    }

    function resetAllFilters() {
      document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('chip-active'));
      document.getElementById('station-dist').value = 500;
      document.getElementById('keyword-input').value = '';
      applyFilters();
    }

    async function switchDataset(ds) {
      currentDataset = ds;
      document.querySelectorAll('.ds-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white');
        b.classList.add('bg-slate-700', 'text-slate-200');
      });
      const activeBtn = document.getElementById(`btn-ds-${ds}`);
      activeBtn.classList.remove('bg-slate-700', 'text-slate-200');
      activeBtn.classList.add('bg-emerald-600', 'text-white');

      const statusEl = document.getElementById('data-status');
      statusEl.textContent = '⏳ 讀取圖資中...';
      statusEl.className = 'text-xs text-amber-300 mt-0.5';

      try {
        const res = await fetch(`./data/hotels_${ds}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('JSON 尚未建立');
        allHotels = await res.json();
        statusEl.textContent = `🟢 已連線真實圖資（共載入 ${allHotels.length} 間飯店）`;
        statusEl.className = 'text-xs text-emerald-400 mt-0.5';

        if (ds === 'kansai') map.setView([34.6937, 135.5023], 12);
        else if (ds === 'tokyo') map.setView([35.6812, 139.7671], 12);
        else map.setView([35.5, 137.0], 6);

        applyFilters();
      } catch (err) {
        statusEl.textContent = `🔴 載入 hotels_${ds}.json 失敗（請確認 Actions 是否已抓取該區）`;
        statusEl.className = 'text-xs text-rose-400 mt-0.5';
      }
    }

    function applyFilters() {
      const maxDist = parseInt(document.getElementById('station-dist').value, 10);
      document.getElementById('station-dist-label').textContent = `${maxDist} 公尺內`;
      const kw = document.getElementById('keyword-input').value.trim().toLowerCase();

      const selLines = Array.from(document.querySelectorAll('#airport-filters .chip-active')).map(el => el.dataset.line);
      const selAms = Array.from(document.querySelectorAll('#amenity-filters .chip-active')).map(el => el.dataset.am);
      const selBrands = Array.from(document.querySelectorAll('#brand-filters .chip-active')).map(el => el.dataset.brand);

      const filtered = allHotels.filter(h => {
        if (h.station_dist > maxDist) return false;
        if (selBrands.length > 0 && !selBrands.includes(h.brand)) return false;
        if (selLines.length > 0 && !selLines.some(l => (h.airport_lines || []).includes(l))) return false;
        if (selAms.length > 0 && !selAms.every(am => (h.amenities?.[am] ?? 9999) <= 300)) return false;
        if (kw && !`${h.name} ${h.station_name} ${h.brand}`.toLowerCase().includes(kw)) return false;
        return true;
      });

      renderResults(filtered);
    }

    function renderResults(list) {
      document.getElementById('result-count').textContent = list.length;
      markersLayer.clearLayers();
      const listEl = document.getElementById('hotel-list');
      listEl.innerHTML = '';

      const displayList = list.slice(0, 80);
      displayList.forEach(h => {
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.name)}&query_place_id=&center=${h.lat},${h.lng}`;
        const linesHtml = (h.airport_lines || []).map(l => `<span class="px-1.5 py-0.5 bg-sky-100 text-sky-800 rounded text-[11px] font-medium">✈️ ${LINE_NAMES[l] || l}</span>`).join(' ');

        const amBadges = [];
        const amLabels = { lawson: 'Lawson', seven: '7-11', familymart: '全家', drugstore: '藥妝', supermarket: '超市', mcdonalds: '麥當勞' };
        for (const [k, label] of Object.entries(amLabels)) {
          const d = h.amenities?.[k];
          if (d !== undefined && d <= 300) {
            amBadges.push(`<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[11px]">${label} ${d}m</span>`);
          }
        }

        const marker = L.marker([h.lat, h.lng]).bindPopup(`
          <div class="text-xs space-y-1">
            <div class="font-bold text-slate-900">${h.name}</div>
            <div class="text-slate-600">🚉 ${h.station_name}（約 ${h.station_dist}m）</div>
            <a href="${gmapUrl}" target="_blank" class="inline-block mt-1 px-2 py-1 bg-blue-600 text-white rounded text-[11px]">開啟 Google 地圖</a>
          </div>
        `);
        markersLayer.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between gap-2';
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-white">${h.brand}</span>
              <span class="text-xs font-semibold text-blue-600">🚉 ${h.station_name} (${h.station_dist}m)</span>
            </div>
            <h3 class="font-bold text-sm text-slate-900 mt-1.5">${h.name}</h3>
            <div class="flex flex-wrap gap-1 mt-1.5">${linesHtml} ${amBadges.join(' ')}</div>
          </div>
          <div class="flex gap-2 pt-1 border-t border-slate-100 text-xs">
            <button onclick="map.setView([${h.lat}, ${h.lng}], 16)" class="flex-1 py-1.5 rounded bg-slate-100 hover:bg-slate-200 font-medium text-slate-700">📍 地圖定位</button>
            <a href="${gmapUrl}" target="_blank" class="flex-1 py-1.5 rounded bg-blue-600 text-white text-center font-medium">🗺️ Google Maps</a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 註冊 Service Worker 啟用離線 PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // 預設載入全國總覽
    switchDataset('all');
  </script>
</body>
</html>
