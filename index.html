<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本連鎖商務飯店地圖篩選器</title>
  <meta name="theme-color" content="#0f172a">
  <!-- 純網頁版：採用 Tailwind CSS 與 Leaflet 地圖套件，無 PWA manifest 或 Service Worker -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    #map { height: 48vh; min-height: 320px; z-index: 1; background: #f8fafc; }
    /* 高對比已選取狀態，確保深底白字清晰可辨，不被 Tailwind 淺色背景蓋過 */
    .chip-active {
      background-color: #0f172a !important;
      color: #ffffff !important;
      border-color: #0f172a !important;
      font-weight: 700 !important;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
    }
    .chip-active::before { content: "✓ "; }
    /* 修正 Leaflet Popup 內連結預設強制藍字，確保 Google 地圖按鈕白字清晰 */
    .leaflet-popup-content a.gmap-popup-btn {
      color: #ffffff !important;
      text-decoration: none !important;
    }
    /* 隱藏橫向分區列捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 國土地理院淡色地圖柔化灰白濾鏡 */
    .gsi-soft-tile {
      filter: grayscale(35%) brightness(1.03) contrast(0.95);
    }
    /* 自訂聯網即時圖釘橘色脈衝樣式 */
    .live-osm-pin {
      background-color: #ea580c;
      border: 2.5px solid #ffffff;
      border-radius: 9999px;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.7);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-12">

  <!-- 頂部導覽列與 9 個全國／區域資料集切換鈕 -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto space-y-2">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-base font-bold tracking-wide">🇯🇵 日本連鎖商務飯店篩選器</h1>
          <p id="data-status" class="text-xs text-emerald-400 mt-0.5">⏳ 正在載入圖資...</p>
        </div>
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hidden sm:inline-block">本機 15 品牌 ＋ 雙模自動聯網搜尋</span>
      </div>
      <div class="flex gap-1.5 text-xs overflow-x-auto no-scrollbar pb-0.5">
        <button onclick="switchDataset('all')" id="btn-ds-all" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-emerald-600 text-white font-medium">全國總覽</button>
        <button onclick="switchDataset('kansai')" id="btn-ds-kansai" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">關西圈</button>
        <button onclick="switchDataset('tokyo')" id="btn-ds-tokyo" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">關東首都圈</button>
        <button onclick="switchDataset('tokai')" id="btn-ds-tokai" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">東海(名古屋)</button>
        <button onclick="switchDataset('kyushu_north')" id="btn-ds-kyushu_north" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">北九州(福岡)</button>
        <button onclick="switchDataset('kyushu_south')" id="btn-ds-kyushu_south" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">南九州(熊本鹿兒島)</button>
        <button onclick="switchDataset('hokkaido')" id="btn-ds-hokkaido" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">北海道</button>
        <button onclick="switchDataset('chugoku')" id="btn-ds-chugoku" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">中國・四國</button>
        <button onclick="switchDataset('tohoku')" id="btn-ds-tohoku" class="ds-btn shrink-0 px-2.5 py-1.5 rounded bg-slate-700 text-slate-200">東北</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 pt-3 space-y-3">
    <!-- 篩選條件設定面板 -->
    <section class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 space-y-3.5">
      <!-- 關鍵字搜尋列（支援精準車站、路線名稱、15大品牌或任何他牌飯店雙模自動聯網即時查詢） -->
      <div>
        <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
          <label class="text-xs font-semibold text-slate-700">🔍 搜尋車站、路線、分店或任何日本飯店（如：「堺站」、「山手線」、「MYSTAYS」、「星野」）</label>
          <span class="text-[11px] text-orange-600 font-medium">未收錄車站／他牌飯店無結果時自動連線 OSM 搜尋</span>
        </div>
        <div class="flex gap-1.5">
          <input type="text" id="keyword-input" placeholder="輸入車站（如：堺站、堺駅）、路線或飯店名（MYSTAYS、星野...）" oninput="markDirty()" onkeydown="if(event.key==='Enter') applyFilters()" class="flex-1 text-sm px-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:border-slate-900">
          <button type="button" onclick="triggerLiveOsmSearch(true)" title="直接向 OpenStreetMap 聯網查詢此車站或飯店" class="shrink-0 px-3 py-1.5 rounded-lg bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-300 text-xs font-bold transition">
            🌐 聯網找飯店
          </button>
        </div>
      </div>

      <!-- 車站距離上限與生活機能距離上限（獨立勾選開關） -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/70">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-700 mb-1.5">
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="enable-station-dist" onchange="toggleSliderState('station'); markDirty()" class="w-4 h-4 accent-slate-900 rounded">
              <span>🚉 限制離車站距離</span>
            </label>
            <span id="station-dist-label" class="text-slate-400 font-medium">不限距離</span>
          </div>
          <input type="range" id="station-dist" min="100" max="2000" step="100" value="500" disabled oninput="updateSliderLabels(); markDirty()" class="w-full accent-slate-900 opacity-40">
        </div>

        <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/70">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-700 mb-1.5">
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" id="enable-amenity-dist" onchange="toggleSliderState('amenity'); markDirty()" class="w-4 h-4 accent-emerald-600 rounded">
              <span>🏪 限制機能步行距離</span>
            </label>
            <span id="amenity-dist-label" class="text-slate-400 font-medium">不限距離（預設 300m）</span>
          </div>
          <input type="range" id="amenity-dist" min="100" max="1000" step="100" value="300" disabled oninput="updateSliderLabels(); markDirty()" class="w-full accent-emerald-600 opacity-40">
        </div>
      </div>

      <!-- 行程大眾運輸路線沿線過濾（「營運商 ➔ 具體路線」聯動下拉選單＋多路線複選標籤） -->
      <div class="p-2.5 rounded-lg border border-violet-200 bg-violet-50/40 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-800">🚃 行程大眾運輸路線沿線過濾（關東・京阪神・福岡全電車地鐵＋全國新幹線）</span>
          <span class="text-[11px] text-violet-700 font-medium">可複選多條路線</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <select id="operator-select" onchange="onOperatorChange()" class="w-full text-xs px-2.5 py-2 border border-slate-300 rounded-lg bg-white text-slate-800 font-medium focus:outline-none focus:border-violet-600">
            <option value="">1. 選擇鐵道／地鐵營運商...</option>
          </select>
          <select id="route-select" onchange="onRouteSelect()" disabled class="w-full text-xs px-2.5 py-2 border border-slate-300 rounded-lg bg-white text-slate-800 font-medium focus:outline-none focus:border-violet-600 disabled:opacity-50">
            <option value="">2. 先選擇左側營運商...</option>
          </select>
        </div>
        <div id="selected-routes-chips" class="flex flex-wrap gap-1.5 text-xs"></div>
      </div>

      <!-- 機場直達交通（2 顆主分類開關 + 隨分區動態切換之細節路線） -->
      <div class="space-y-2">
        <div class="text-xs font-semibold text-slate-700">✈️ 機場直達交通（可與上方行程路線同時交集篩選）</div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="airport-main-filters">
          <button type="button" data-airmode="ANY_RAIL" onclick="toggleChip(this)" class="filter-chip px-3 py-1.5 rounded-full border border-sky-300 bg-sky-50 text-sky-900 font-medium">🚆 直達機場鐵路站點</button>
          <button type="button" data-airmode="ANY_BUS" onclick="toggleChip(this)" class="filter-chip px-3 py-1.5 rounded-full border border-indigo-300 bg-indigo-50 text-indigo-900 font-medium">🚌 機場利木津巴士站點</button>
        </div>
        <div class="flex flex-wrap gap-1.5 text-xs pt-0.5" id="airport-sub-filters"></div>
      </div>

      <!-- 必備生活機能（11 項：3 大超商 + Top 3 咖啡 + Top 3 速食 + 藥妝超市） -->
      <div>
        <div class="text-xs font-semibold text-slate-700 mb-1.5">🏪 必備生活機能（勾選上方距離限制則套用該上限，未勾選則預設 300m 內）</div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="amenity-filters">
          <button type="button" data-am="lawson" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50 text-slate-700">Lawson</button>
          <button type="button" data-am="seven" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50 text-slate-700">7-Eleven</button>
          <button type="button" data-am="familymart" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50 text-slate-700">FamilyMart</button>
          <button type="button" data-am="starbucks" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-amber-300 bg-amber-50 text-slate-800">☕ 星巴克</button>
          <button type="button" data-am="doutor" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-amber-300 bg-amber-50 text-slate-800">☕ 羅多倫 Doutor</button>
          <button type="button" data-am="komeda" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-amber-300 bg-amber-50 text-slate-800">☕ 客美多 Komeda</button>
          <button type="button" data-am="mcdonalds" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-orange-300 bg-orange-50 text-slate-800">🍔 麥當勞</button>
          <button type="button" data-am="mos" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-orange-300 bg-orange-50 text-slate-800">🍔 摩斯漢堡</button>
          <button type="button" data-am="kfc" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-orange-300 bg-orange-50 text-slate-800">🍗 肯德基 KFC</button>
          <button type="button" data-am="drugstore" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50 text-slate-700">💊 藥妝店</button>
          <button type="button" data-am="supermarket" onclick="toggleChip(this)" class="filter-chip px-2.5 py-1 rounded-full border border-slate-300 bg-slate-50 text-slate-700">🛒 超市</button>
        </div>
      </div>

      <!-- 15 大連鎖商務飯店品牌 -->
      <div>
        <div class="text-xs font-semibold text-slate-700 mb-1.5">🏨 內建 15 大連鎖商務飯店品牌（未選則顯示全部 15 品牌；未收錄站點或他牌自動聯網查詢）</div>
        <div class="flex flex-wrap gap-1.5 text-xs" id="brand-filters"></div>
      </div>

      <!-- 底部手動套用搜尋與清除重設按鈕 -->
      <div class="flex gap-2 pt-2 border-t border-slate-100">
        <button type="button" id="btn-search" onclick="applyFilters()" class="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold text-sm shadow-sm transition flex items-center justify-center gap-1.5">
          <span>🔍</span>
          <span id="btn-search-text">套用條件並搜尋</span>
        </button>
        <button type="button" onclick="resetAllFilters()" class="py-2.5 px-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs border border-slate-300">
          清除重設
        </button>
      </div>
    </section>

    <!-- 聯網查詢狀態與提示橫幅 -->
    <div id="live-search-banner" class="hidden rounded-xl p-3 border text-xs flex flex-wrap items-center justify-between gap-2"></div>

    <!-- 互動地圖區塊（預設國土地理院淡色柔化 + 4種穩定底圖切換） -->
    <section class="relative bg-white rounded-xl overflow-hidden shadow-sm border border-slate-200">
      <div id="map"></div>
      <button type="button" id="btn-locate" onclick="locateUser()" class="absolute top-2.5 right-2.5 z-[500] flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/95 hover:bg-white text-slate-800 border border-slate-300 shadow-md text-xs font-semibold active:scale-95 transition">
        <span id="locate-icon">📍</span>
        <span id="locate-text">定位我的位置</span>
      </button>
      <div class="absolute bottom-2.5 left-2.5 z-[500] flex flex-wrap gap-1 bg-white/95 p-1 rounded-lg border border-slate-300 shadow-sm text-[11px]">
        <button type="button" onclick="setBaseMap('pale_soft')" id="map-style-pale_soft" class="map-style-btn px-2 py-1 rounded bg-slate-900 text-white font-semibold">淡色柔化</button>
        <button type="button" onclick="setBaseMap('pale')" id="map-style-pale" class="map-style-btn px-2 py-1 rounded text-slate-700 hover:bg-slate-100">淡色原圖</button>
        <button type="button" onclick="setBaseMap('osm')" id="map-style-osm" class="map-style-btn px-2 py-1 rounded text-slate-700 hover:bg-slate-100">經典街道</button>
        <button type="button" onclick="setBaseMap('std')" id="map-style-std" class="map-style-btn px-2 py-1 rounded text-slate-700 hover:bg-slate-100">詳細地形</button>
      </div>
    </section>

    <!-- 篩選結果列表 -->
    <section id="results-section" class="space-y-2">
      <div class="flex flex-wrap justify-between items-center gap-2 px-1">
        <h2 class="text-sm font-bold text-slate-800">符合條件飯店 (<span id="result-count">0</span> 間)</h2>
        <div class="flex items-center gap-2">
          <span id="sort-status-label" class="text-xs text-slate-500">依距離車站由近到遠排序</span>
          <button type="button" id="btn-toggle-sort" onclick="toggleSortMode()" class="hidden text-xs px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 font-medium">切換排序</button>
        </div>
      </div>
      <div id="hotel-list" class="grid grid-cols-1 md:grid-cols-2 gap-2.5"></div>
    </section>
  </main>

  <script>
    // ==========================================
    // 1. 基礎設定與 15 大連鎖商務飯店品牌名稱智慧補全設定
    // ==========================================
    const BRANDS = [
      "Toyoko Inn", "Dormy Inn", "APA Hotel", "Super Hotel", "Via Inn",
      "Route Inn", "Comfort Hotel", "Daiwa Roynet", "Richmond Hotel",
      "Fresa Inn", "Mitsui Garden", "Tokyu Stay", "Washington Hotel",
      "LiveMax", "Hotel Metropolitan"
    ];

    const BRAND_NAME_CONFIG = {
      "Toyoko Inn":         { prefix: "東横INN",               pureRegex: /^(東横イン|東橫イン|東横inn|toyoko\s*inn)$/i, detectRegex: /東横イン|東橫イン|東横inn|toyoko\s*inn/i },
      "Dormy Inn":          { prefix: "ドーミーイン",           pureRegex: /^(ドーミーイン|dormy\s*inn)$/i, detectRegex: /ドーミーイン|dormy\s*inn|御宿\s*野乃|onyado\s*nono/i },
      "APA Hotel":          { prefix: "アパホテル",             pureRegex: /^(アパホテル|apa\s*hotel)$/i, detectRegex: /アパホテル|apa\s*hotel/i },
      "Super Hotel":        { prefix: "スーパーホテル",         pureRegex: /^(スーパーホテル|super\s*hotel)$/i, detectRegex: /スーパーホテル|super\s*hotel/i },
      "Via Inn":            { prefix: "ヴィアイン",             pureRegex: /^(ヴィアイン|via\s*inn)$/i, detectRegex: /ヴィアイン|via\s*inn/i },
      "Route Inn":          { prefix: "ホテルルートイン",       pureRegex: /^(ルートイン|ホテルルートイン|route\s*inn)$/i, detectRegex: /ルートイン|route\s*inn/i },
      "Comfort Hotel":      { prefix: "コンフォートホテル",     pureRegex: /^(コンフォートホテル|コンフォートイン|comfort\s*(hotel|inn))$/i, detectRegex: /コンフォート|comfort\s*(hotel|inn)/i },
      "Daiwa Roynet":       { prefix: "ダイワロイネットホテル", pureRegex: /^(ダイワロイネット|ダイワロイネットホテル|daiwa\s*roynet(\s*hotel)?)$/i, detectRegex: /ダイワロイネット|daiwa\s*roynet/i },
      "Richmond Hotel":     { prefix: "リッチモンドホテル",     pureRegex: /^(リッチモンドホテル|richmond\s*hotel)$/i, detectRegex: /リッチモンドホテル|richmond\s*hotel/i },
      "Fresa Inn":          { prefix: "相鉄フレッサイン",       pureRegex: /^(相鉄フレッサイン|フレッサイン|fresa\s*inn)$/i, detectRegex: /フレッサイン|fresa\s*inn/i },
      "Mitsui Garden":      { prefix: "三井ガーデンホテル",     pureRegex: /^(三井ガーデンホテル|mitsui\s*garden(\s*hotel)?)$/i, detectRegex: /三井ガーデン|mitsui\s*garden/i },
      "Tokyu Stay":         { prefix: "東急ステイ",             pureRegex: /^(東急ステイ|tokyu\s*stay)$/i, detectRegex: /東急ステイ|tokyu\s*stay/i },
      "Washington Hotel":   { prefix: "ワシントンホテル",       pureRegex: /^(ワシントンホテル|ワシントンr&b|r&bホテル|washington\s*hotel)$/i, detectRegex: /ワシントンホテル|r&bホテル|washington\s*hotel/i },
      "LiveMax":            { prefix: "ホテルリブマックス",     pureRegex: /^(ホテルリブマックス|リブマックス|livemax)$/i, detectRegex: /リブマックス|livemax/i },
      "Hotel Metropolitan": { prefix: "ホテルメトロポリタン",   pureRegex: /^(ホテルメトロポリタン|metropolitan)$/i, detectRegex: /メトロポリタン|metropolitan/i }
    };

    const LINE_NAMES = {
      "RAIL_HARUKA": "關空 JR HARUKA", "RAIL_NANKAI": "關空 南海電鐵",
      "RAIL_NEX": "成田 JR N'EX", "RAIL_KEISEI": "成田 京成電鐵",
      "RAIL_KEIKYU": "羽田 京急線", "RAIL_MONO": "羽田 東京單軌",
      "RAIL_MEITETSU": "中部 名鐵機場線", "RAIL_FUKUOKA": "福岡地下鐵機場線",
      "RAIL_CTS": "新千歲 JR快速Airport", "RAIL_SENDAI": "仙台機場Access線",
      "RAIL_MIYAZAKI": "宮崎機場線",
      "BUS_KIX": "關空利木津巴士", "BUS_TYO": "成田/羽田利木津巴士",
      "BUS_NGO": "中部機場巴士", "BUS_FUK": "福岡機場巴士", "BUS_KKJ": "北九州機場巴士",
      "BUS_KMJ": "阿蘇熊本機場巴士", "BUS_KOJ": "鹿兒島機場巴士",

    const ZH_TO_JA_MAP = [
      [/廣島/g, "広島"], [/澀谷/g, "渋谷"], [/橫濱/g, "横浜"], [/淺草/g, "浅草"],

      [/瀧/g, "滝"], [/鐵/g, "鉄"], [/東橫/g, "東横"], [/榮町/g, "栄町"], [/榮/g, "栄"],
      [/心齋橋/g, "心斎橋"], [/齋/g, "斎"], [/櫻町/g, "桜町"], [/總站/g, "ターミナル"],

    // ==========================================
    // 4. 精準車站名稱解析、距離計算與全 15 品牌店名補全引擎
    // ==========================================
    function calcDistanceM(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function detectBrandFromText(txt) {
      for (const [brandName, cfg] of Object.entries(BRAND_NAME_CONFIG)) {
        if (cfg.detectRegex.test(txt)) return brandName;
      }
      return null;
    }

    function enrichHotelName(h) {
      const rawName = (h.name || "").trim();
      const brandCfg = BRAND_NAME_CONFIG[h.brand];
      if (brandCfg && brandCfg.pureRegex.test(rawName)) {
        const cleanSt = (h.station_name || "").replace(/駅$/, "");
        if (cleanSt && cleanSt !== "周邊車站") {
          return h.station_dist <= 350
            ? `${brandCfg.prefix} ${cleanSt}駅前`
            : `${brandCfg.prefix}（${cleanSt}駅周邊）`;
        }
      }
      return rawName;
    }

    function hotelMatchesRoute(hotel, routeKey) {
      const routeInfo = RAILWAY_LINES_DB[routeKey];
      if (!routeInfo) return false;
      if (hotel.region && routeInfo.allowedRegions && !routeInfo.allowedRegions.includes(hotel.region)) {
        return false;
      }
      const cleanHotelSt = (hotel.station_name || "").replace(/駅$/, "").trim();
      if (!cleanHotelSt) return false;
      return routeInfo.stations.some(st => {
        const cleanSt = st.replace(/駅$/, "").trim();
        return cleanHotelSt === cleanSt;
      });
    }

    function parseSearchQuery(rawInput) {
      let raw = (rawInput || "").trim().toLowerCase();
      if (!raw) return { tokens: [], isStationMode: false, queryRouteKeys: [] };

      const queryRouteKeys = [];
      let remaining = raw;

      const aliasPairs = [];
      for (const [rKey, info] of Object.entries(RAILWAY_LINES_DB)) {
        for (const al of (info.aliases || [])) {
          aliasPairs.push([al.toLowerCase(), rKey]);
        }
      }
      aliasPairs.sort((a, b) => b[0].length - a[0].length);

      for (const [aliasLower, rKey] of aliasPairs) {
        if (remaining.includes(aliasLower)) {
          if (!queryRouteKeys.includes(rKey)) queryRouteKeys.push(rKey);
          remaining = remaining.split(aliasLower).join(" ");
        }
      }

      const isStationMode = /車站|火車站|地鐵站|站|駅/.test(remaining) && !/巴士總站|バスターミナル/.test(remaining);
      let cleaned = remaining.replace(/車站|火車站|地鐵站|站|駅/g, " ");
      for (const [re, ja] of ZH_TO_JA_MAP) {
        cleaned = cleaned.replace(re, ja);
      }

      return {
        tokens: cleaned.split(/\s+/).filter(Boolean),
        isStationMode,
        queryRouteKeys
      };
    }

    function hotelMatchesTokens(h, tokens, isStationMode) {
      if (tokens.length === 0) return true;
      const cleanHotelSt = h._stationLower.replace(/駅$/, "").trim();

      if (isStationMode) {
        return tokens.every(tk => cleanHotelSt === tk);
      }

      return tokens.every(tk => {
        if (tk === "堺") {
          return cleanHotelSt === "堺" || h._areaLower.includes("堺市");
        }
        return h._fullSearchStr.includes(tk);
      });
    }

    // ==========================================
    // 5. 雙模自動聯網搜尋引擎（模式 A：車站聯網定位 900m 掃描 ＋ 模式 B：飯店名稱聯網搜尋）
    // ==========================================
    let currentDataset = 'all';
    let isLiveSearching = false;
    let lastAutoLiveQuery = '';
    const liveOsmCache = new Map();

    function escapeOverpassRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function inferAirportAccessFromStation(stName) {

        "RAIL_NEX": ["成田空港", "空港第2ビル", "東京", "品川", "渋谷", "新宿", "池袋", "横浜", "武蔵小杉", "大船", "千葉"],
        "RAIL_KEISEI": ["京成上野", "上野", "日暮里", "青砥", "京成高砂", "京成船橋", "京成成田", "押上", "空港第2ビル", "成田空港"],
        "RAIL_KEIKYU": ["羽田空港", "品川", "京急蒲田", "川崎", "横浜", "泉岳寺", "大門", "浜松町", "新橋", "東銀座", "浅草"],
        "RAIL_MONO": ["浜松町", "天王洲アイル", "羽田空港"],
        "RAIL_MEITETSU": ["名鉄名古屋", "名古屋", "金山", "神宮前", "太田川", "常滑", "中部国際空港"],
        "RAIL_FUKUOKA": ["福岡空港", "博多", "祇園", "中洲川端", "天神", "赤坂", "大濠公園", "西新", "姪浜"],
        "RAIL_CTS": ["新千歳空港", "南千歳", "千歳", "恵庭", "北広島", "新札幌", "札幌", "桑園", "琴似", "手稲", "小樽"],
        "RAIL_SENDAI": ["仙台空港", "名取", "南仙台", "太子堂", "長町", "仙台"]

      for (const [code, kws] of Object.entries(rules)) {

    function classifyLiveAmenity(tags) {
      const shop = tags.shop || "";
      const am = tags.amenity || "";
      const txt = `${tags.name || ""} ${tags["name:ja"] || ""} ${tags.brand || ""}`.toLowerCase();
      if (shop === "convenience" || /ローソン|セブン|ファミリーマート|lawson|seven|familymart/.test(txt)) {
        if (/ローソン|lawson/.test(txt)) return "lawson";
        if (/セブン|7-eleven|seven-eleven|7 eleven/.test(txt)) return "seven";
        if (/ファミリーマート|ファミマ|familymart|family mart/.test(txt)) return "familymart";
      }
      if (am === "cafe" || /スターバックス|ドトール|コメダ|starbucks|doutor|komeda/.test(txt)) {
        if (/スターバックス|スタバ|starbucks/.test(txt)) return "starbucks";
        if (/ドトール|doutor/.test(txt)) return "doutor";
        if (/コメダ|komeda/.test(txt)) return "komeda";
      }
      if (am === "fast_food" || /マクドナルド|モスバーガー|ケンタッキー|mcdonald|mos|kfc/.test(txt)) {
        if (/マクドナルド|マック|mcdonald/.test(txt)) return "mcdonalds";
        if (/モスバーガー|mos/.test(txt)) return "mos";
        if (/ケンタッキー|kfc|kentucky/.test(txt)) return "kfc";
      }
      if (shop === "chemist" || shop === "pharmacy" || am === "pharmacy" || /マツモトキヨシ|ウエルシア|ダイコク|スギ薬局|ツルハ|ココカラファイン|サンドラッグ|ドラッグ|薬局|drug/.test(txt)) {
        return "drugstore";
      }
      if (shop === "supermarket" || /ライフ|玉出|業務スーパー|イオン|マックスバリュ|成城石井|まいばすけっと|スーパー/.test(txt)) {
        return "supermarket";
      }
      return null;
    }

    function setLiveBanner(html, type = 'info') {
      const el = document.getElementById('live-search-banner');
      if (!html) {
        el.classList.add('hidden');
        el.innerHTML = '';
        return;
      }
      el.classList.remove('hidden', 'bg-orange-50', 'border-orange-300', 'text-orange-900', 'bg-sky-50', 'border-sky-300', 'text-sky-900', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
      if (type === 'loading') {
        el.classList.add('bg-sky-50', 'border-sky-300', 'text-sky-900');
      } else if (type === 'error') {
        el.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
      } else {
        el.classList.add('bg-orange-50', 'border-orange-300', 'text-orange-900');
      }
      el.innerHTML = html;
    }

    async function fetchOverpassWithFallback(queryStr) {
      let lastErr = null;
      for (const url of OVERPASS_ENDPOINTS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 16000);
        try {
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: 'data=' + encodeURIComponent(queryStr),
            signal: controller.signal
          });
          clearTimeout(timer);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          return data.elements || [];
        } catch (err) {
          clearTimeout(timer);
          lastErr = err;
        }
      }
      throw lastErr || new Error('Overpass 節點無回應');
    }

    // 透過 Nominatim 地理編碼 API 精準定位日本車站座標
    async function geocodeJapanStation(cleanStationName, regionKey) {
      const regionHint = REGION_CONTEXT_JA[regionKey] || "";
      const bbox = REGION_BBOX[regionKey] || REGION_BBOX.all;
      const viewbox = `${bbox[1]},${bbox[2]},${bbox[3]},${bbox[0]}`; // left,top,right,bottom

      const queries = [
        `${cleanStationName}駅 ${regionHint}`.trim(),
        `${cleanStationName}駅`,
        `${cleanStationName} ${regionHint}`.trim()
      ];

      for (const q of queries) {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&limit=8&viewbox=${encodeURIComponent(viewbox)}&bounded=${regionKey === 'all' ? 0 : 1}&q=${encodeURIComponent(q)}`;
          const resp = await fetch(url, { headers: { 'Accept-Language': 'ja,zh-TW' } });
          if (!resp.ok) continue;
          const items = await resp.json();
          if (!Array.isArray(items) || items.length === 0) continue;

          // 優先挑 railway=station 或名稱完全吻合的車站點位
          const exactStation = items.find(it =>
            (it.class === 'railway' || it.type === 'station' || it.type === 'halt') &&
            (it.name === cleanStationName || it.name === `${cleanStationName}駅` || (it.display_name || '').startsWith(cleanStationName))
          ) || items.find(it => it.class === 'railway' || it.type === 'station') || items[0];

          if (exactStation) {
            return {
              lat: parseFloat(exactStation.lat),
              lng: parseFloat(exactStation.lon),
              displayName: exactStation.name || `${cleanStationName}駅`
            };
          }
        } catch (e) {
          // 繼續嘗試下一組查詢
        }
      }
      return null;
    }

    // 雙模自動聯網搜尋主程式（模式 A：車站聯網定位 900m 飯店與機能掃描 / 模式 B：飯店名稱聯網搜尋）
    async function triggerLiveOsmSearch(isManual = false) {
      const rawKw = (document.getElementById('keyword-input').value || '').trim();
      if (!rawKw) {
        if (isManual) showNotice('請先在搜尋框輸入想找的車站（如：堺站）或飯店名稱（如：MYSTAYS）');
        return;
      }
      if (isLiveSearching) return;

      const { tokens, isStationMode } = parseSearchQuery(rawKw);
      let jaKw = rawKw.replace(/車站|火車站|地鐵站|站|駅/g, '').trim();
      for (const [re, ja] of ZH_TO_JA_MAP) {
        jaKw = jaKw.replace(re, ja);
      }
      if (!jaKw) jaKw = rawKw;

      const selBrands = Array.from(document.querySelectorAll('#brand-filters .chip-active')).map(el => el.dataset.brand);
      const stEnabled = document.getElementById('enable-station-dist').checked;
      const maxStationDist = stEnabled ? parseInt(document.getElementById('station-dist').value, 10) : Infinity;
      const amEnabled = document.getElementById('enable-amenity-dist').checked;
      const effectiveAmDist = amEnabled ? parseInt(document.getElementById('amenity-dist').value, 10) : 300;
      const selAms = Array.from(document.querySelectorAll('#amenity-filters .chip-active')).map(el => el.dataset.am);

      isLiveSearching = true;

      try {
        // ====================================================
        // 【模式 A：車站聯網定位模式】輸入包含「站 / 駅」（如：堺站、堺駅、堺東）
        // ====================================================
        if (isStationMode && tokens.length > 0) {
          const targetStName = jaKw;
          const cacheKey = `STATION_MODE::${currentDataset}::${targetStName}`;
          setLiveBanner(
            `<div class="flex items-center gap-2 font-semibold"><span>⏳</span><span>【車站聯網定位模式】正在定位「<b>${targetStName}駅</b>」並掃描方圓 900 公尺內飯店建築物與周邊機能...</span></div>`,
            'loading'
          );

          let stationHotels = liveOsmCache.get(cacheKey);
          if (!stationHotels) {
            const geo = await geocodeJapanStation(targetStName, currentDataset);
            if (!geo) {
              setLiveBanner(`<div>⚠️ 無法在目前選擇的區域定位到「<b>${targetStName}駅</b>」，請嘗試切換上方分區（例如「關西圈」或「全國總覽」）。</div>`, 'error');
              renderResults([], effectiveAmDist);
              return;
            }

            // 抓取車站方圓 900m 內所有飯店建築物中心 (out center)、周邊車站與 1200m 內超商藥妝咖啡廳
            const ql = `
              [out:json][timeout:18];
              (
                nw["tourism"~"hotel|hostel|guest_house|motel"](around:900,${geo.lat},${geo.lng});
                nw["building"="hotel"](around:900,${geo.lat},${geo.lng});
                node["railway"="station"](around:900,${geo.lat},${geo.lng});
                node["shop"~"convenience|supermarket|chemist"](around:1200,${geo.lat},${geo.lng});
                nw["shop"~"supermarket|chemist"](around:1200,${geo.lat},${geo.lng});
                node["amenity"~"cafe|fast_food|pharmacy"](around:1200,${geo.lat},${geo.lng});
              );
              out center tags;
            `;
            const elements = await fetchOverpassWithFallback(ql);

            const rawHotels = [];
            const stations = [{ name: targetStName, lat: geo.lat, lng: geo.lng }];
            const amPools = { lawson: [], seven: [], familymart: [], starbucks: [], doutor: [], komeda: [], mcdonalds: [], mos: [], kfc: [], drugstore: [], supermarket: [] };

            for (const el of elements) {
              const tags = el.tags || {};
              const lat = el.center ? el.center.lat : el.lat;
              const lng = el.center ? el.center.lon : el.lon;
              if (lat == null || lng == null) continue;

              if (tags.railway === 'station') {
                stations.push({ name: tags['name:ja'] || tags.name || targetStName, lat, lng });
              } else if (tags.tourism === 'hotel' || tags.tourism === 'hostel' || tags.tourism === 'guest_house' || tags.building === 'hotel') {
                const rawName = tags['name:ja'] || tags.name || tags['name:en'] || '';
                if (!rawName) continue;
                rawHotels.push({
                  id: `live_st_${el.type}_${el.id}`,
                  rawName,
                  isPoly: el.type === 'way' || el.type === 'relation',
                  lat: Number(lat.toFixed(6)),
                  lng: Number(lng.toFixed(6)),
                  tags
                });
              } else {
                const amKey = classifyLiveAmenity(tags);
                if (amKey && amPools[amKey]) {
                  amPools[amKey].push({ lat, lng });
                }
              }
            }

            // 優先保留建築物多邊形幾何中心 (isPoly=true) 並去重
            rawHotels.sort((a, b) => (b.isPoly ? 1 : 0) - (a.isPoly ? 1 : 0));
            const deduped = [];
            for (const h of rawHotels) {
              if (deduped.some(prev => calcDistanceM(h.lat, h.lng, prev.lat, prev.lng) < 65)) continue;

              // 計算距離目標車站與最近車站
              const distToTargetSt = calcDistanceM(h.lat, h.lng, geo.lat, geo.lng);
              let minStD = distToTargetSt;
              let bestStName = targetStName;
              for (const st of stations) {
                const d = calcDistanceM(h.lat, h.lng, st.lat, st.lng);
                if (d < minStD - 30) {
                  minStD = d;
                  bestStName = st.name;
                }
              }

              // 計算 11 項周邊生活機能最近距離
              const amDists = {};
              for (const [k, pts] of Object.entries(amPools)) {
                let md = 9999;
                for (const pt of pts) {
                  const d = calcDistanceM(h.lat, h.lng, pt.lat, pt.lng);
                  if (d < md) md = d;
                }
                amDists[k] = md;
              }

              const detectedBrand = detectBrandFromText(`${h.rawName} ${h.tags.brand || ''} ${h.tags.operator || ''}`);
              const areaParts = [h.tags['addr:prefecture'], h.tags['addr:city'], h.tags['addr:ward'], h.tags['addr:suburb']].filter(Boolean).join(' ');
              const enriched = enrichHotelName({
                name: h.rawName,
                brand: detectedBrand || '',
                station_name: bestStName,
                station_dist: minStD
              });

              deduped.push({
                id: h.id,
                name: enriched,
                brand: detectedBrand || '🌐 聯網即時圖資',
                _isChain15: Boolean(detectedBrand),
                area: areaParts || `${targetStName}駅周邊（OSM 建築物幾何中心）`,
                region: currentDataset === 'all' ? '' : currentDataset,
                lat: h.lat,
                lng: h.lng,
                station_name: bestStName,
                station_dist: minStD,
                airport_lines: inferAirportAccessFromStation(bestStName),
                amenities: amDists,
                _isLiveOsm: true,
                _liveAmenitiesLoaded: true
              });
            }

            deduped.sort((a, b) => a.station_dist - b.station_dist);
            stationHotels = { geo, hotels: deduped };
            liveOsmCache.set(cacheKey, stationHotels);
          }

          // 套用使用者勾選的 15 品牌、車站距離與生活機能過濾條件
          const filteredStationHotels = stationHotels.hotels
            .filter(h => {
              if (h.station_dist > maxStationDist) return false;
              if (selBrands.length > 0 && !selBrands.includes(h.brand)) return false;
              if (selAms.length > 0 && !selAms.every(am => (h.amenities?.[am] ?? 9999) <= effectiveAmDist)) return false;
              return true;
            })
            .map(h => ({
              ...h,
              _userDist: userPos ? calcDistanceM(userPos.lat, userPos.lng, h.lat, h.lng) : null
            }));

          map.setView([stationHotels.geo.lat, stationHotels.geo.lng], 15);
          if (filteredStationHotels.length === 0) {
            setLiveBanner(
              `<div>🌐 已定位至「<b>${targetStName}駅</b>」，方圓 900m 內共掃描到 ${stationHotels.hotels.length} 間飯店，但無符合目前勾選品牌或距離限制的項目。</div>`,
              'error'
            );
          } else {
            setLiveBanner(
              `<div class="flex flex-wrap items-center justify-between w-full gap-2">
                <span>🌐 <b>車站聯網定位成功</b>：已定位「<b>${targetStName}駅</b>」並掃描方圓 900m 內建築物中心，找到 <b>${filteredStationHotels.length}</b> 間符合條件飯店（已自動計算周邊超商／藥妝距離）。</span>
                <button type="button" onclick="resetAllFilters()" class="px-2 py-0.5 rounded bg-orange-200/80 hover:bg-orange-300 text-orange-950 font-bold">清除重設</button>
              </div>`,
              'info'
            );
          }
          document.getElementById('sort-status-label').textContent = `🌐 已聯網鎖定「${targetStName}駅」周邊 900m（依距離車站排序）`;
          document.getElementById('sort-status-label').className = 'text-xs text-orange-700 font-semibold';
          renderResults(filteredStationHotels, effectiveAmDist);
          return;
        }

        // ====================================================
        // 【模式 B：飯店名稱聯網搜尋模式】搜尋 15 品牌以外飯店或特定分店名
        // ====================================================
        let bbox = REGION_BBOX[currentDataset] || REGION_BBOX.all;
        if (currentDataset === 'all' && map && map.getZoom() >= 10) {
          const b = map.getBounds();
          bbox = [
            Number(b.getSouth().toFixed(4)),
            Number(b.getWest().toFixed(4)),
            Number(b.getNorth().toFixed(4)),
            Number(b.getEast().toFixed(4))
          ];
        }
        const bboxStr = `${bbox[0]},${bbox[1]},${bbox[2]},${bbox[3]}`;
        const cacheKey = `HOTEL_MODE::${bboxStr}::${jaKw.toLowerCase()}`;

        setLiveBanner(
          `<div class="flex items-center gap-2 font-semibold"><span>⏳</span><span>【飯店名稱聯網模式】本機無符合項目，正在即時連線 OpenStreetMap 搜尋「<b>${rawKw}</b>」...</span></div>`,
          'loading'
        );

        let liveHotels = liveOsmCache.get(cacheKey);
        if (!liveHotels) {
          const safeRegex = escapeOverpassRegex(jaKw);
          const ql = `
            [out:json][timeout:15];
            (
              nw["tourism"~"hotel|hostel|guest_house|motel"]["name"~"${safeRegex}",i](${bboxStr});
              nw["building"="hotel"]["name"~"${safeRegex}",i](${bboxStr});
              nw["tourism"~"hotel|hostel"]["name:ja"~"${safeRegex}",i](${bboxStr});
              nw["tourism"~"hotel|hostel"]["name:en"~"${safeRegex}",i](${bboxStr});
            )->.hotels;
            .hotels out center tags 35;
            node(around.hotels:1500)["railway"="station"];
            out body tags;
          `;
          const elements = await fetchOverpassWithFallback(ql);

          const rawHotels = [];
          const stations = [];
          for (const el of elements) {
            const tags = el.tags || {};
            const lat = el.center ? el.center.lat : el.lat;
            const lng = el.center ? el.center.lon : el.lon;
            if (lat == null || lng == null) continue;

            if (tags.railway === 'station') {
              stations.push({ name: tags['name:ja'] || tags.name || '周邊車站', lat, lng });
            } else if (tags.name || tags['name:ja'] || tags['name:en']) {
              rawHotels.push({
                id: `live_osm_${el.type}_${el.id}`,
                name: tags['name:ja'] || tags.name || tags['name:en'],
                isPoly: el.type === 'way' || el.type === 'relation',
                lat: Number(lat.toFixed(6)),
                lng: Number(lng.toFixed(6)),
                tags
              });
            }
          }

          rawHotels.sort((a, b) => (b.isPoly ? 1 : 0) - (a.isPoly ? 1 : 0));
          const deduped = [];
          for (const h of rawHotels) {
            if (deduped.some(prev => calcDistanceM(h.lat, h.lng, prev.lat, prev.lng) < 60 && prev.name === h.name)) {
              continue;
            }
            let minD = 9999;
            let nearestSt = '周邊車站';
            for (const st of stations) {
              const d = calcDistanceM(h.lat, h.lng, st.lat, st.lng);
              if (d < minD) {
                minD = d;
                nearestSt = st.name;
              }
            }
            const detectedBrand = detectBrandFromText(`${h.name} ${h.tags.brand || ''}`);
            const areaParts = [h.tags['addr:prefecture'], h.tags['addr:city'], h.tags['addr:ward'], h.tags['addr:suburb']].filter(Boolean).join(' ');
            deduped.push({
              id: h.id,
              name: enrichHotelName({ name: h.name, brand: detectedBrand || '', station_name: nearestSt, station_dist: minD }),
              brand: detectedBrand || h.tags.brand || '🌐 聯網即時圖資',
              area: areaParts || 'OpenStreetMap 即時圖資',
              region: currentDataset === 'all' ? '' : currentDataset,
              lat: h.lat,
              lng: h.lng,
              station_name: nearestSt,
              station_dist: minD,
              airport_lines: inferAirportAccessFromStation(nearestSt),
              amenities: {},
              _isLiveOsm: true,
              _liveAmenitiesLoaded: false
            });
          }
          deduped.sort((a, b) => a.station_dist - b.station_dist);
          liveHotels = deduped;
          liveOsmCache.set(cacheKey, liveHotels);
        }

        if (liveHotels.length === 0) {
          setLiveBanner(
            `<div>🌐 已即時連線 OpenStreetMap 搜尋「<b>${rawKw}</b>」，目前範圍內未找到符合飯店（可切換上方分區、縮放地圖視野，或改用日文片假名搜尋）。</div>`,
            'error'
          );
          renderResults([], effectiveAmDist);
        } else {
          setLiveBanner(
            `<div class="flex flex-wrap items-center justify-between w-full gap-2">
              <span>🌐 <b>飯店聯網搜尋成功</b>：從 OpenStreetMap 找到 <b>${liveHotels.length}</b> 間「${rawKw}」相關飯店（已對齊建築物幾何中心並計算最近車站）。</span>
              <button type="button" onclick="resetAllFilters()" class="px-2 py-0.5 rounded bg-orange-200/80 hover:bg-orange-300 text-orange-950 font-bold">返回 15 品牌列表</button>
            </div>`,
            'info'
          );
          const withUser = liveHotels.map(h => ({
            ...h,
            _userDist: userPos ? calcDistanceM(userPos.lat, userPos.lng, h.lat, h.lng) : null
          }));
          if (withUser.length > 0) {
            map.setView([withUser[0].lat, withUser[0].lng], 14);
          }
          document.getElementById('sort-status-label').textContent = '🌐 聯網即時結果（依距離最近車站排序）';
          document.getElementById('sort-status-label').className = 'text-xs text-orange-700 font-semibold';
          renderResults(withUser, effectiveAmDist);
        }
      } catch (err) {
        setLiveBanner(
          `<div>⚠️ 聯網查詢 OpenStreetMap 暫時逾時或繁忙，請稍候 3 秒再試一次。</div>`,
          'error'
        );
      } finally {
        isLiveSearching = false;
      }
    }

    // 為模式 B 聯網查到的他牌飯店現場計算 350m 內周邊超商／藥妝機能
    async function fetchLiveAmenitiesForHotel(hotelId, lat, lng, btnEl) {
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = '⏳ 計算 350m 機能中...';
      }
      try {
        const ql = `
          [out:json][timeout:12];
          (
            node(around:350,${lat},${lng})["shop"~"convenience|supermarket|chemist"];
            node(around:350,${lat},${lng})["amenity"~"cafe|fast_food|pharmacy"];
          );
          out body tags;
        `;
        const elements = await fetchOverpassWithFallback(ql);
        const found = [];
        const checkMap = [
          { key: 'lawson', label: 'Lawson', re: /ローソン|lawson/i },
          { key: 'seven', label: '7-11', re: /セブン|7-eleven|seven-eleven/i },
          { key: 'familymart', label: '全家', re: /ファミリーマート|familymart/i },
          { key: 'starbucks', label: '星巴克', re: /スターバックス|starbucks/i },
          { key: 'doutor', label: '羅多倫', re: /ドトール|doutor/i },
          { key: 'mcdonalds', label: '麥當勞', re: /マクドナルド|mcdonald/i },
          { key: 'drugstore', label: '藥妝', re: /マツモトキヨシ|ウエルシア|ダイコク|スギ薬局|ツルハ|ココカラファイン|サンドラッグ|ドラッグ|薬局/i },
          { key: 'supermarket', label: '超市', re: /ライフ|業務スーパー|イオン|マックスバリュ|成城石井|まいばすけっと|スーパー/i }
        ];
        const minDists = {};
        for (const el of elements) {
          if (el.lat == null || el.lon == null) continue;
          const tags = el.tags || {};
          const txt = `${tags.name || ''} ${tags['name:ja'] || ''} ${tags.brand || ''}`;
          const d = calcDistanceM(lat, lng, el.lat, el.lon);
          for (const item of checkMap) {
            if (item.re.test(txt) || (item.key === 'drugstore' && tags.amenity === 'pharmacy') || (item.key === 'supermarket' && tags.shop === 'supermarket')) {
              if (minDists[item.label] === undefined || d < minDists[item.label]) {
                minDists[item.label] = d;
              }
            }
          }
        }
        for (const [lbl, d] of Object.entries(minDists)) {
          if (d <= 350) found.push(`${lbl} ${d}m`);
        }
        const targetBox = document.getElementById(`live-am-${hotelId}`);
        if (targetBox) {
          targetBox.innerHTML = found.length > 0
            ? found.map(t => `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[11px]">${t}</span>`).join(' ')
            : `<span class="text-[11px] text-slate-400">350m 內無連鎖超商/藥妝標記</span>`;
        }
        if (btnEl) btnEl.remove();
      } catch (e) {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.textContent = '⚠️ 重試機能計算';
        }
      }
    }

    // 路線聯動下拉選單與複選標籤管理
    const selectedRouteKeys = new Set();

    function populateOperatorSelect(regionKey) {
      const opSelect = document.getElementById('operator-select');
      const prevVal = opSelect.value;
      opSelect.innerHTML = '<option value="">1. 選擇鐵道／地鐵營運商...</option>';
      OPERATORS_DB.forEach(op => {
        if (regionKey === 'all' || op.regions.includes(regionKey)) {
          const opt = document.createElement('option');
          opt.value = op.id;
          opt.textContent = op.label;
          opSelect.appendChild(opt);
        }
      });
      if (Array.from(opSelect.options).some(o => o.value === prevVal)) {
        opSelect.value = prevVal;
      } else {
        opSelect.value = '';
      }
      onOperatorChange();
    }

    function onOperatorChange() {
      const opId = document.getElementById('operator-select').value;
      const routeSelect = document.getElementById('route-select');
      if (!opId) {
        routeSelect.innerHTML = '<option value="">2. 先選擇左側營運商...</option>';
        routeSelect.disabled = true;
        return;
      }
      routeSelect.disabled = false;
      routeSelect.innerHTML = '<option value="">2. 選擇具體路線加入篩選...</option>';
      Object.entries(RAILWAY_LINES_DB).forEach(([rKey, info]) => {
        if (info.op === opId) {
          const opt = document.createElement('option');
          opt.value = rKey;
          opt.textContent = info.label;
          routeSelect.appendChild(opt);
        }
      });
    }

    function onRouteSelect() {
      const routeSelect = document.getElementById('route-select');
      const rKey = routeSelect.value;
      if (!rKey) return;
      selectedRouteKeys.add(rKey);
      routeSelect.value = '';
      renderSelectedRouteChips();
      markDirty();
    }

    function removeSelectedRoute(rKey) {
      selectedRouteKeys.delete(rKey);
      renderSelectedRouteChips();
      markDirty();
    }

    function renderSelectedRouteChips() {
      const container = document.getElementById('selected-routes-chips');
      container.innerHTML = '';
      selectedRouteKeys.forEach(rKey => {
        const info = RAILWAY_LINES_DB[rKey];
        if (!info) return;
        const badge = document.createElement('span');
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-violet-900 text-white font-semibold shadow-sm';
        badge.innerHTML = `<span>🚃 ${info.label}</span><button type="button" onclick="removeSelectedRoute('${rKey}')" class="ml-0.5 text-violet-200 hover:text-white font-bold">✕</button>`;
        container.appendChild(badge);
      });
    }

    // ==========================================

    let map, markersLayer, userLayer, currentTileLayer;
    let userPos = null;
    let sortByUser = false;

    const TILE_LAYERS = {

      },
      pale: {

      },
      osm: {

    const brandContainer = document.getElementById('brand-filters');

    function renderAirportSubChips(regionKey) {
      const container = document.getElementById('airport-sub-filters');
      container.innerHTML = '';
      const codes = REGION_AIRPORT_SUBS[regionKey] || REGION_AIRPORT_SUBS["all"];
      codes.forEach(code => {

        btn.type = 'button';

      });

    map = L.map('map').setView([36.2, 137.5], 5);
    currentTileLayer = L.tileLayer(TILE_LAYERS.pale_soft.url, {
      attribution: TILE_LAYERS.pale_soft.attr,
      className: TILE_LAYERS.pale_soft.className,
      maxZoom: 18
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
    userLayer = L.layerGroup().addTo(map);

    function setBaseMap(styleKey) {
      const cfg = TILE_LAYERS[styleKey] || TILE_LAYERS.pale_soft;
      if (currentTileLayer) map.removeLayer(currentTileLayer);
      currentTileLayer = L.tileLayer(cfg.url, {
        attribution: cfg.attr,
        className: cfg.className || '',
        maxZoom: 18
      }).addTo(map);

      document.querySelectorAll('.map-style-btn').forEach(b => {
        b.classList.remove('bg-slate-900', 'text-white', 'font-semibold');
        b.classList.add('text-slate-700', 'hover:bg-slate-100');
      });
      const activeBtn = document.getElementById(`map-style-${styleKey}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-700', 'hover:bg-slate-100');
        activeBtn.classList.add('bg-slate-900', 'text-white', 'font-semibold');
      }

    // ==========================================
    // 7. 篩選控制、GPS 定位與渲染列表
    // ==========================================
    function markDirty() {
      const btn = document.getElementById('btn-search');
      const txt = document.getElementById('btn-search-text');
      btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
      btn.classList.add('bg-amber-600', 'hover:bg-amber-700');
      txt.textContent = '條件已變更，點此搜尋更新';
    }

    function clearDirty() {
      const btn = document.getElementById('btn-search');
      const txt = document.getElementById('btn-search-text');
      btn.classList.remove('bg-amber-600', 'hover:bg-amber-700');
      btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
      txt.textContent = '套用條件並搜尋';
    }

    function toggleSliderState(type) {
      const cb = document.getElementById(`enable-${type}-dist`);
      const slider = document.getElementById(`${type}-dist`);
      slider.disabled = !cb.checked;
      slider.classList.toggle('opacity-40', !cb.checked);
      updateSliderLabels();
    }

    function updateSliderLabels() {
      const stEnabled = document.getElementById('enable-station-dist').checked;
      const stVal = document.getElementById('station-dist').value;
      const stLabel = document.getElementById('station-dist-label');
      stLabel.textContent = stEnabled ? `${stVal} 公尺內` : '不限距離';
      stLabel.className = stEnabled ? 'text-blue-600 font-bold' : 'text-slate-400 font-medium';

      const amEnabled = document.getElementById('enable-amenity-dist').checked;
      const amVal = document.getElementById('amenity-dist').value;
      const amLabel = document.getElementById('amenity-dist-label');
      amLabel.textContent = amEnabled ? `${amVal} 公尺內` : '不限距離（預設 300m）';
      amLabel.className = amEnabled ? 'text-emerald-600 font-bold' : 'text-slate-400 font-medium';
    }

    function formatDist(m) {
      return m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${m}m`;
    }

    function showNotice(msg) {
      const statusEl = document.getElementById('data-status');
      const prevText = statusEl.textContent;
      const prevClass = statusEl.className;
      statusEl.textContent = `⚠️ ${msg}`;
      statusEl.className = 'text-xs text-amber-300 mt-0.5';
      setTimeout(() => {
        statusEl.textContent = prevText;
        statusEl.className = prevClass;
      }, 4000);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showNotice('您的瀏覽器不支援 GPS 定位功能');
        return;
      }
      const textEl = document.getElementById('locate-text');
      const iconEl = document.getElementById('locate-icon');
      textEl.textContent = '定位中...';
      iconEl.textContent = '⏳';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const acc = Math.min(pos.coords.accuracy || 50, 300);

          userLayer.clearLayers();
          L.circle([userPos.lat, userPos.lng], {
            radius: acc, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.15, weight: 1
          }).addTo(userLayer);

          L.circleMarker([userPos.lat, userPos.lng], {
            radius: 7, color: '#ffffff', weight: 2, fillColor: '#2563eb', fillOpacity: 1
          }).bindPopup('<div class="text-xs font-bold text-blue-700">📍 您目前所在位置</div>').addTo(userLayer).openPopup();

          map.setView([userPos.lat, userPos.lng], 15);
          textEl.textContent = '重新定位';
          iconEl.textContent = '🔵';

          sortByUser = true;
          document.getElementById('btn-toggle-sort').classList.remove('hidden');
          applyFilters();
        },
        () => {
          textEl.textContent = '定位我的位置';
          iconEl.textContent = '📍';
          showNotice('無法取得目前位置，請確認已開啟瀏覽器定位權限');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    function toggleSortMode() {
      if (!userPos) return;
      sortByUser = !sortByUser;
      applyFilters();
    }

    function toggleChip(el) {
      el.classList.toggle('chip-active');
      markDirty();
    }

    function resetAllFilters() {
      setLiveBanner('');
      lastAutoLiveQuery = '';
      document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('chip-active'));
      selectedRouteKeys.clear();
      renderSelectedRouteChips();
      document.getElementById('operator-select').value = '';
      onOperatorChange();
      document.getElementById('enable-station-dist').checked = false;
      document.getElementById('enable-amenity-dist').checked = false;
      document.getElementById('station-dist').value = 500;
      document.getElementById('amenity-dist').value = 300;
      toggleSliderState('station');
      toggleSliderState('amenity');
      document.getElementById('keyword-input').value = '';
      applyFilters();
    }

    function inferArea(h) {
      if (h.area) return h.area;
      let best = "", minD = 999999;
      for (const [lat, lng, label] of FALLBACK_AREAS) {
        const d = Math.hypot(h.lat - lat, h.lng - lng);
        if (d < minD) { minD = d; best = label; }
      }
      return best;
    }

    function prepareHotelsList(rawList) {
      return rawList.map(h => {
        const displayName = enrichHotelName(h);
        const areaStr = inferArea(h);
        return {
          ...h,
          name: displayName,
          _areaLower: areaStr.toLowerCase(),
          _stationLower: (h.station_name || "").toLowerCase(),
          _fullSearchStr: `${displayName} ${h.station_name} ${h.brand} ${areaStr}`.toLowerCase()
        };
      });
    }

    async function switchDataset(ds) {
      currentDataset = ds;
      setLiveBanner('');
      lastAutoLiveQuery = '';

      document.querySelectorAll('.ds-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white');
        b.classList.add('bg-slate-700', 'text-slate-200');
      });
      const activeBtn = document.getElementById(`btn-ds-${ds}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-700', 'text-slate-200');
        activeBtn.classList.add('bg-emerald-600', 'text-white');
      }

      populateOperatorSelect(ds);
      renderAirportSubChips(ds);

      const statusEl = document.getElementById('data-status');
      statusEl.textContent = '⏳ 讀取圖資中...';
      statusEl.className = 'text-xs text-amber-300 mt-0.5';

      try {
        const res = await fetch(`./data/hotels_${ds}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('JSON_UNAVAILABLE');
        const raw = await res.json();
        allHotels = prepareHotelsList(raw);
        statusEl.textContent = `🟢 已連線真實圖資（共載入 ${allHotels.length} 間 15 品牌飯店）`;
        statusEl.className = 'text-xs text-emerald-400 mt-0.5';
      } catch (err) {
        const sampleBase = ds === 'all'
          ? DEMO_HOTELS
          : DEMO_HOTELS.filter(h => h.region === ds);
        allHotels = prepareHotelsList(sampleBase);
        statusEl.textContent = `🟢 預覽模式（已載入高精度示範圖資，共 ${allHotels.length} 間代表飯店）`;
        statusEl.className = 'text-xs text-emerald-400 mt-0.5';
      }

      const view = REGION_VIEWS[ds] || [36.2, 137.5, 5];
      map.setView([view[0], view[1]], view[2]);
      setTimeout(() => map.invalidateSize(), 200);
      applyFilters();
    }

    function applyFilters() {
      clearDirty();
      setLiveBanner('');

      const stEnabled = document.getElementById('enable-station-dist').checked;
      const maxStationDist = stEnabled ? parseInt(document.getElementById('station-dist').value, 10) : Infinity;

      const amEnabled = document.getElementById('enable-amenity-dist').checked;
      const sliderAmDist = parseInt(document.getElementById('amenity-dist').value, 10);
      const effectiveAmDist = amEnabled ? sliderAmDist : 300;

      const rawKeyword = (document.getElementById('keyword-input').value || '').trim();
      const { tokens, isStationMode, queryRouteKeys } = parseSearchQuery(rawKeyword);
      const activeRoutes = Array.from(new Set([...selectedRouteKeys, ...queryRouteKeys]));

      const selAirModes = Array.from(document.querySelectorAll('#airport-main-filters .chip-active')).map(el => el.dataset.airmode);
      const selSubLines = Array.from(document.querySelectorAll('#airport-sub-filters .chip-active')).map(el => el.dataset.line);
      const selAms = Array.from(document.querySelectorAll('#amenity-filters .chip-active')).map(el => el.dataset.am);
      const selBrands = Array.from(document.querySelectorAll('#brand-filters .chip-active')).map(el => el.dataset.brand);

      const filtered = allHotels
        .filter(h => {
          if (h.station_dist > maxStationDist) return false;
          if (selBrands.length > 0 && !selBrands.includes(h.brand)) return false;

          if (activeRoutes.length > 0) {
            const onAnyRoute = activeRoutes.some(rKey => hotelMatchesRoute(h, rKey));
            if (!onAnyRoute) return false;
          }

          const lines = h.airport_lines || [];
          if (selAirModes.length > 0) {
            const hasRail = lines.some(l => l.startsWith('RAIL_') || ['JR_HARUKA', 'NANKAI', 'JR_NEX', 'KEISEI', 'KEIKYU', 'MONORAIL'].includes(l));
            const hasBus = lines.some(l => l.startsWith('BUS_'));
            const matchMode = selAirModes.some(m => (m === 'ANY_RAIL' && hasRail) || (m === 'ANY_BUS' && hasBus));
            if (!matchMode) return false;
          }
          if (selSubLines.length > 0 && !selSubLines.some(l => lines.includes(l))) return false;

          if (selAms.length > 0 && !selAms.every(am => (h.amenities?.[am] ?? 9999) <= effectiveAmDist)) return false;

          if (!hotelMatchesTokens(h, tokens, isStationMode)) return false;

          return true;
        })
        .map(h => {
          const matchedRouteLabels = activeRoutes
            .filter(rKey => hotelMatchesRoute(h, rKey))
            .map(rKey => RAILWAY_LINES_DB[rKey]?.label || rKey);
          return {
            ...h,
            _matchedRoutes: matchedRouteLabels,
            _userDist: userPos ? calcDistanceM(userPos.lat, userPos.lng, h.lat, h.lng) : null
          };
        });

      const sortLabel = document.getElementById('sort-status-label');
      if (sortByUser && userPos) {
        filtered.sort((a, b) => a._userDist - b._userDist);
        sortLabel.textContent = '🔵 依距離我目前位置由近到遠排序';
        sortLabel.className = 'text-xs text-blue-600 font-semibold';
      } else {
        filtered.sort((a, b) => a.station_dist - b.station_dist);
        if (activeRoutes.length > 0) {
          sortLabel.textContent = '🚃 已鎖定所選路線沿線車站（依距離車站排序）';
          sortLabel.className = 'text-xs text-violet-700 font-semibold';
        } else if (isStationMode && tokens.length > 0) {
          sortLabel.textContent = '🚉 已精準鎖定該車站周邊（依距離車站排序）';
          sortLabel.className = 'text-xs text-blue-600 font-semibold';
        } else {
          sortLabel.textContent = '依距離車站由近到遠排序';
          sortLabel.className = 'text-xs text-slate-500';
        }
      }

      if ((tokens.length > 0 || activeRoutes.length > 0) && filtered.length > 0) {
        const zoomLevel = activeRoutes.length > 0 && tokens.length === 0 ? 11 : 15;
        map.setView([filtered[0].lat, filtered[0].lng], zoomLevel);
      }

      renderResults(filtered, effectiveAmDist);

      // 雙模自動聯網觸發：無論是輸入未收錄的車站（如「堺站」、「堺駅」）或輸入 15 品牌以外的飯店名，只要本機為 0 筆即自動連線 OSM 查詢
      const canAutoLiveFallback =
        filtered.length === 0 &&
        rawKeyword.length >= 1 &&
        queryRouteKeys.length === 0 &&
        (isStationMode || (rawKeyword.length >= 2 && selBrands.length === 0));

      if (canAutoLiveFallback && lastAutoLiveQuery !== `${currentDataset}::${rawKeyword}`) {
        lastAutoLiveQuery = `${currentDataset}::${rawKeyword}`;
        triggerLiveOsmSearch(false);
      } else if (filtered.length === 0 && rawKeyword.length >= 1) {
        setLiveBanner(
          `<div class="flex flex-wrap items-center justify-between w-full gap-2">
            <span>💡 本機資料庫未找到「<b>${rawKeyword}</b>」。可點擊右側按鈕直接連線 OpenStreetMap 查詢該車站周邊或全品牌飯店：</span>
            <button type="button" onclick="triggerLiveOsmSearch(true)" class="px-2.5 py-1 rounded-lg bg-orange-600 hover:bg-orange-700 text-white font-bold shadow-sm">🌐 聯網找飯店</button>
          </div>`,
          'info'
        );
      }
    }

    function renderResults(list, badgeMaxDist) {
      document.getElementById('result-count').textContent = list.length;
      markersLayer.clearLayers();
      const listEl = document.getElementById('hotel-list');
      listEl.innerHTML = '';

      const amLabels = {
        lawson: 'Lawson', seven: '7-11', familymart: '全家',
        starbucks: '星巴克', doutor: '羅多倫', komeda: '客美多',
        mcdonalds: '麥當勞', mos: '摩斯', kfc: 'KFC',
        drugstore: '藥妝', supermarket: '超市'
      };

      const liveIcon = L.divIcon({
        className: 'live-osm-pin',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -8]
      });

      list.slice(0, 80).forEach(h => {
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lng}`;
        const isLive = Boolean(h._isLiveOsm);

        const routeBadgesHtml = (h._matchedRoutes || []).map(lbl =>
          `<span class="px-1.5 py-0.5 bg-violet-100 text-violet-900 border border-violet-200 rounded text-[11px] font-semibold">🚃 ${lbl}</span>`
        ).join(' ');

        const linesHtml = (h.airport_lines || []).map(l => {
          const isBus = l.startsWith('BUS_');
          const icon = isBus ? '🚌' : '✈️';
          const color = isBus ? 'bg-indigo-100 text-indigo-800' : 'bg-sky-100 text-sky-800';
          return `<span class="px-1.5 py-0.5 ${color} rounded text-[11px] font-medium">${icon} ${LINE_NAMES[l] || l}</span>`;
        }).join(' ');

        const amBadges = [];
        for (const [k, label] of Object.entries(amLabels)) {
          const d = h.amenities?.[k];
          if (d !== undefined && d <= badgeMaxDist) {
            amBadges.push(`<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-[11px]">${label} ${d}m</span>`);
          }
        }

        const userDistBadge = h._userDist !== null
          ? `<span class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-blue-100 text-blue-800">📍 距我 ${formatDist(h._userDist)}</span>`
          : '';

        const stText = h.station_dist < 9000 ? `${h.station_name} (${h.station_dist}m)` : `${h.station_name}`;

        const markerOpts = isLive ? { icon: liveIcon } : {};
        const marker = L.marker([h.lat, h.lng], markerOpts).bindPopup(`
          <div class="text-xs space-y-1.5">
            ${isLive ? '<div class="text-[10px] font-bold text-orange-700 bg-orange-100 px-1.5 py-0.5 rounded inline-block">🌐 聯網即時圖資</div>' : ''}
            <div class="font-bold text-slate-900">${h.name}</div>
            <div class="text-slate-600">🚉 ${stText}</div>
            ${h._matchedRoutes && h._matchedRoutes.length > 0 ? `<div class="text-violet-700 font-semibold">🚃 ${h._matchedRoutes.join('、')}</div>` : ''}
            ${h._userDist !== null ? `<div class="text-blue-700 font-semibold">📍 距離目前位置約 ${formatDist(h._userDist)}</div>` : ''}
            <a href="${gmapUrl}" target="_blank" class="gmap-popup-btn inline-block mt-1 px-2.5 py-1.5 bg-blue-600 rounded text-[11px] font-bold shadow-sm">🗺️ 開啟 Google 地圖</a>
          </div>
        `);
        markersLayer.addLayer(marker);

        const brandBadgeHtml = isLive
          ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded bg-orange-600 text-white">${h.brand}</span>`
          : `<span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-white">${h.brand}</span>`;

        const liveAmenityActionHtml = (isLive && !h._liveAmenitiesLoaded)
          ? `<div class="mt-1 flex flex-wrap items-center gap-1" id="live-am-${h.id}">
               <button type="button" onclick="fetchLiveAmenitiesForHotel('${h.id}', ${h.lat}, ${h.lng}, this)" class="px-2 py-0.5 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 text-[11px] font-medium">🏪 現場計算 350m 超商／藥妝</button>
             </div>`
          : '';

        const card = document.createElement('div');
        card.className = isLive
          ? 'bg-white p-3 rounded-xl border-2 border-orange-200 shadow-sm flex flex-col justify-between gap-2'
          : 'bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between gap-2';
        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1">
                ${brandBadgeHtml}
                ${userDistBadge}
              </div>
              <span class="text-xs font-semibold text-blue-600 shrink-0">🚉 ${stText}</span>
            </div>
            <h3 class="font-bold text-sm text-slate-900 mt-1.5">${h.name}</h3>
            <p class="text-[11px] text-slate-500 mt-0.5">${h.area}</p>
            <div class="flex flex-wrap gap-1 mt-1.5">${routeBadgesHtml} ${linesHtml} ${amBadges.join(' ')}</div>
            ${liveAmenityActionHtml}
          </div>
          <div class="flex gap-2 pt-1 border-t border-slate-100 text-xs">
            <button onclick="map.setView([${h.lat}, ${h.lng}], 16)" class="flex-1 py-1.5 rounded bg-slate-100 hover:bg-slate-200 font-medium text-slate-700">📍 地圖定位</button>
            <a href="${gmapUrl}" target="_blank" class="flex-1 py-1.5 rounded bg-blue-600 text-white text-center font-medium">🗺️ Google Maps</a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    switchDataset('all');
  </script>
</body>
</html>
